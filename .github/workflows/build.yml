
name: Build WinLite Debian 13 ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "auto/**"
      - "config/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian 13 live USB ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates

      - name: Configure live-build
        shell: bash
        run: |
          set -o pipefail
          sudo lb config 2>&1 | tee config.log

      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log

      - name: Find ISO output
        if: always()
        run: |
          find . -maxdepth 4 -type f \
            \( -name "*.iso" -o -name "*.log" \) -ls || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlite-build-logs
          path: |
            build.log
            config.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: winlite-debian13-live-iso-amd64
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
