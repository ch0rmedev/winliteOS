name: Build WinLite Debian 13 ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "auto/**"
      - "config/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build live USB ISO (Debian 13 amd64)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ISO build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            ca-certificates

      - name: Configure live-build
        run: |
          set -o pipefail
          lb config 2>&1 | tee config.log
        shell: bash

      - name: Build ISO
        run: |
          set -o pipefail
          lb build 2>&1 | tee build.log
        shell: bash

      - name: List build output
        if: always()
        run: |
          echo "Workspace files:"
          ls -lah
          echo "ISO files:"
          find . -maxdepth 2 -type f -name "*.iso" -ls || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlite-build-logs
          path: |
            build.log
            config.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: winlite-debian13-live-iso-amd64
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
