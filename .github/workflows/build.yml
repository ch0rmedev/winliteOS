name: Build WinLite Debian 13 ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "auto/**"
      - "config/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build-iso:
    name: Build Debian 13 Trixie live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools dosfstools ca-certificates \
            wget cpio rsync gettext-base

      - name: Install Debian Trixie live-build
        shell: bash
        run: |
          set -euxo pipefail
          wget -O /tmp/live-build-trixie.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y /tmp/live-build-trixie.deb
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          lb --version

      - name: Clean previous live-build configuration
        shell: bash
        run: |
          sudo lb clean --purge || true
          sudo rm -f config/{binary,bootstrap,chroot,common,source}

      - name: Configure explicitly for Debian Trixie
        shell: bash
        run: |
          set -euxo pipefail
          sudo lb config noauto \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --apt-recommends false \
            --firmware-chroot true \
            --firmware-binary true \
            --mirror-bootstrap https://deb.debian.org/debian \
            --mirror-chroot https://deb.debian.org/debian \
            --mirror-binary https://deb.debian.org/debian \
            --mirror-chroot-security https://security.debian.org/debian-security \
            --mirror-binary-security https://security.debian.org/debian-security \
            --bootappend-live "boot=live components username=winlite hostname=winlite" \
            2>&1 | tee config.log
          if grep -RniE --exclude='*.log' 'precise|trixie/updates' config; then
            echo "ERROR: obsolete Ubuntu or Debian security suite found in configuration." >&2
            exit 1
          fi

      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log

      - name: List build output
        if: always()
        run: |
          echo "Workspace files:"
          ls -lah
          echo "ISO files:"
          find . -maxdepth 4 -type f -name "*.iso" -ls || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlite-build-logs
          path: |
            build.log
            config.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: winlite-debian13-live-iso-amd64
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          retention-days: 7
